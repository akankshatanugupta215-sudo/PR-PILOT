name: PRPilot review

on:
  pull_request:
    types: [opened, reopened, synchronize]

# pull_request (rather than pull_request_target) keeps forked PRs untrusted:
# no repository secrets are exposed and GitHub downgrades the token to read-only.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: PRPilot AI review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job checks out only the trusted default branch; it never executes
    # code from the pull request.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PRPilot dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python -m prpilot.review
