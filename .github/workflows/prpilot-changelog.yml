name: PRPilot draft changelog

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: read

jobs:
  draft:
    # Only merged PRs produce an entry. Configure the protected environment with
    # required reviewers before enabling this workflow: this is the human gate.
    if: github.event.pull_request.merged == true
    environment: prpilot-release-notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Create a human-approved changelog draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m prpilot.changelog_action
